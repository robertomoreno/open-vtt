<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Provider gate</title></head><body>
<main>
<label>Room link <input id="link" autocomplete="off"></label>
<label>Participant <input id="participant" value="p"></label>
<button id="connect" type="button">Connect</button>
<label>Value <input id="small-value" autocomplete="off"></label>
<button id="publish" type="button">Publish value</button>
<button id="publish-large" type="button">Publish large value</button>
<button id="close" type="button">Close</button>
<p>Phase: <output id="phase">idle</output></p>
<p>Native opens: <output id="opens">0</output></p>
<p>Received: <output id="received"></output></p>
<p>Large received: <output id="large"></output></p>
<p>Error: <output id="error"></output></p>
</main>
<script type="module" src="./provider-gate.ts"></script>
</body></html>
